<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Loader</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="loader">
        <div class="popup-slide">
            <img class="change" src="./images/posts/haryana-day.jpeg" alt="Image 1">
            <img src="./images/posts/karwa.jpeg" alt="Image 2">
            <img src="./images/posts/haryana-day.jpeg" alt="Image 3">
            <button class="close-button" onclick="closeImage()">X</button>
        </div>
    </div>

    <div class="content">
        <!-- Your website content goes here -->
    </div>

    <script>
        const slide = document.querySelectorAll(".popup-slide img");
        let i = 1;
        setInterval(() => {
            i++;
            const slider = document.querySelector(".popup-slide .change")
            slider.classList.remove('change')
            if (i > slide.length) {
                slide[0].classList.add("change")
                i = 1;
            } else {
                slider.nextElementSibling.classList.add("change")
            }
        }, 2000);
        function closeImage() {
            const loader = document.querySelector('.loader');
            loader.style.display = "none";
        }
        document.addEventListener("DOMContentLoaded", function () {
            // Hide the loader and show the content when the page is fully loaded
            const loader = document.querySelector('.loader');
            const content = document.querySelector('.content');

            setTimeout(function () {
                loader.style.display = "none";
                content.style.display = "block";
            }, 8000); // Adjust the delay time as needed (3 seconds in this example)
        });

    </script>
</body>

</html>
